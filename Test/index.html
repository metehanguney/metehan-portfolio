    <style>
        600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050b14; margin:0; color:white; }
        
        /* Animasyonlar */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes confetti-sway {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 1; }
            25% { transform: translateY(25vh) translateX(20px) rotate(90deg); }
            50% { transform: translateY(50vh) translateX(-20px) rotate(180deg); }
            75% { transform: translateY(75vh) translateX(20px) rotate(270deg); }
            100% { transform: translateY(110vh) translateX(0) rotate(360deg); opacity: 0; }
        }
        @keyframes drive { 0% { transform: translateX(0); } 100% { transform: translateX(400px); } }
        @keyframes walk { 0% { transform: translateX(0); } 100% { transform: translateX(400px); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }

        .animate-float { animation: float 6s ease-in-out infinite; }
        .perspective-container { perspective: 1000px; }
        .rotate-3d-moto { transform: rotateY(-15deg) rotateX(5deg); transform-style: preserve-3d; transition: transform 0.5s ease; }
        .rotate-3d-walker { transform: rotateY(10deg) rotateX(-5deg); transform-style: preserve-3d; transition: transform 0.5s ease; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .map-locked { filter: grayscale(100%) brightness(30%) contrast(120%); transition: all 1s ease; }
        .neon-text-cyan { text-shadow: 0 0 20px rgba(12, 236, 221, 0.5); }

        /* Custom Date Picker Styles */
        input[type="date"], input[type="time"] {
            color-scheme: dark;
        }
