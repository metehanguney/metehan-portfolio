<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515"><title>Semazen Restaurant Cafe | QR Menü</title><style>*{box-sizing:border-box}body{margin:0;background:#f9f4e9;color:#211d17;font-family:system-ui,Arial,sans-serif}header{background:#151515;color:#fff;padding:28px 18px;text-align:center}header h1{font-family:Georgia,serif;letter-spacing:.12em;color:#e9bd64;font-size:clamp(34px,7vw,58px);margin:10px}header p{color:#e5d6b6}.languages{display:flex;justify-content:center;gap:8px;margin:22px 0}.languages button,.filters button{cursor:pointer;border:1px solid #c8a66a;border-radius:30px;padding:11px 15px;background:#fff;color:#252017}.languages button[aria-pressed=true],.filters button.active{background:#c9a05a;color:#17130d;font-weight:700}main{max-width:1100px;margin:auto;padding:24px 16px 65px}.search{padding:15px;width:100%;font-size:16px;border:1px solid #d6c9b2;border-radius:12px}.filters{display:flex;gap:8px;overflow-x:auto;padding:20px 0}.filters button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}.card{background:#fff;border:1px solid #e4d9c4;border-radius:16px;padding:20px}.card .emoji{font-size:35px}.card h3{margin:10px 0 8px}.price{color:#805a20;font-size:22px;font-weight:800}footer{text-align:center;background:#151515;color:#ead8b8;padding:30px}footer a{color:#e9bd64}body[dir=rtl] .card{text-align:right}.notice{font-size:13px;color:#756852;margin:15px 0}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>SEMAZEN</h1><div>RESTAURANT & CAFE</div><p id="intro"></p><div class="languages"><button data-lang="tr">🇹🇷 Türkçe</button><button data-lang="en">🇬🇧 English</button><button data-lang="ar">🇸🇦 العربية</button></div></header><main><input class="search" id="search" type="search"><nav class="filters" id="filters"></nav><p class="notice" id="notice"></p> const translations={tr:{intro:"Geleneksel lezzetlerimizi keşfedin",search:"Menüde ara...",notice:"Önizleme: ürünlerin tamamı ve fotoğrafları henüz aktarılmadı.",route:"Yol tarifi",cats:["Tümü","Kahvaltı & Çorba","Döner","Kebap","Pide","Tatlı","İçecek"]},en:{intro:"Discover our traditional flavors",search:"Search the menu...",notice:"Preview: full catalog and photos are not imported yet.",route:"Directions",cats:["All","Breakfast & Soup","Doner","Kebab","Pide","Dessert","Drinks"]},ar:{intro:"اكتشفوا نكهاتنا التقليدية",search:"ابحث في القائمة...",notice:"معاينة: لم تتم إضافة جميع الأصناف والصور بعد.",route:"الاتجاهات",cats:["الكل","الفطور والشوربة","الدونر","الكباب","الفطائر","الحلويات","المشروبات"]}};
const products=[
[1,1300,"🍳","Serpme Kahvaltı","Mixed Breakfast","فطور مشكل"],
[1,130,"🥣","Mercimek / Ezogelin Çorbası","Lentil / Ezogelin Soup","شوربة عدس أو إيزوغلين"],
[2,330,"🥙","Tombik Et Döner","Doner Sandwich","ساندويتش شاورما اللحم"],

[2,600,"🍚","Pilav Üstü Döner","Doner on Rice","شاورما لحم على الأرز"],

];
let lang=localStorage.getItem("semazenLang")||"tr",cat=0;const $=id=>document.getElementById(id);function render(){const t=translations[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.body.dir=document.documentElement.dir;$("intro").textContent=t.intro;$("search").placeholder=t.search;$("notice").textContent=t.notice;$("route").textContent=t.route;document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));$("filters").replaceChildren(...t.cats.map((name,i)=>{const b=document.createElement("button");b.textContent=name;b.className=cat===i?"active":"";b.onclick=()=>{cat=i;render()};return b}));const q=$("search").value.toLocaleLowerCase();$("grid").replaceChildren(...products.filter(p=>(cat===0||p[0]===cat)&&p.slice(3).some(n=>n.toLocaleLowerCase().includes(q))).map(p=>{const a=document.createElement("article");a.className="card";const e=document.createElement("div");e.className="emoji";e.textContent=p[2];const h=document.createElement("h3");h.textContent=p[3+["tr","en","ar"].indexOf(lang)];const v=document.createElement("div");v.className="price";v.textContent=new Intl.NumberFormat("tr-TR").format(p[1])+" ₺";a.append(e,h,v);return a}))}document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("semazenLang",lang);render()});$("search").oninput=render;render();
</script></body></html>
