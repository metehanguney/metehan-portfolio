<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151515"><title>Semazen Restaurant Cafe | QR Menü</title><style>*{box-sizing:border-box}body{margin:0;background:#f9f4e9;color:#211d17;font-family:system-ui,Arial,sans-serif}header{background:#151515;color:#fff;padding:28px 18px;text-align:center}header h1{font-family:Georgia,serif;letter-spacing:.12em;color:#e9bd64;font-size:clamp(34px,7vw,58px);margin:10px}header p{color:#e5d6b6}.languages{display:flex;justify-content:center;gap:8px;margin:22px 0}.languages button,.filters button{cursor:pointer;border:1px solid #c8a66a;border-radius:30px;padding:11px 15px;background:#fff;color:#252017}.languages button[aria-pressed=true],.filters button.active{background:#c9a05a;color:#17130d;font-weight:700}main{max-width:1100px;margin:auto;padding:24px 16px 65px}.search{padding:15px;width:100%;font-size:16px;border:1px solid #d6c9b2;border-radius:12px}.filters{display:flex;gap:8px;overflow-x:auto;padding:20px 0}.filters button{white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}.card{background:#fff;border:1px solid #e4d9c4;border-radius:16px;padding:20px}.card .emoji{font-size:35px}.card h3{margin:10px 0 8px}.price{color:#805a20;font-size:22px;font-weight:800}footer{text-align:center;background:#151515;color:#ead8b8;padding:30px}footer a{color:#e9bd64}body[dir=rtl] .card{text-align:right}.notice{font-size:13px;color:#756852;margin:15px 0}@media(max-width:500px){.grid{grid-template-columns:1fr}}.card{padding:0;overflow:hidden;box-shadow:0 8px 30px rgba(45,31,13,.07);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(45,31,13,.12)}.card .visual{height:140px;background:linear-gradient(125deg,#22201d,#5c4830);display:flex;align-items:center;justify-content:center;position:relative}.card .visual::after{content:"SEMAZEN";position:absolute;bottom:12px;right:15px;color:#d6b577;font:10px Georgia,serif;letter-spacing:.25em}.card .emoji{font-size:58px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.3))}.card .details{padding:18px 20px 22px;display:flex;flex-direction:column;gap:9px;min-height:130px}.card h3{font-size:17px;line-height:1.45;margin:0}.price{margin-top:auto}.search:focus-visible,.languages button:focus-visible,.filters button:focus-visible{outline:3px solid #b18b45;outline-offset:3px}header{padding:38px 18px 28px;background:radial-gradient(circle at 50% 0,#403321,#151515 65%)}header h1{text-shadow:0 2px 20px rgba(231,189,100,.17)}.languages{flex-wrap:wrap}.filters{position:sticky;top:0;background:#f9f4e9;z-index:2;scrollbar-width:thin}.filters button{font-size:14px}.notice{background:#fff7e8;border-left:3px solid #bd9855;padding:12px;border-radius:6px}body[dir=rtl] .notice{border-left:0;border-right:3px solid #bd9855}body[dir=rtl] .card .visual::after{right:auto;left:15px}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card .visual{height:100px}.card .emoji{font-size:43px}.card .details{padding:12px;min-height:124px}.card h3{font-size:14px}.price{font-size:18px}main{padding:18px 12px 60px}}@media(max-width:350px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.card{transition:none}}

</style></head><body><header><h1>SEMAZEN</h1><div>RESTAURANT & CAFE</div><p id="intro"></p><div class="languages"><button data-lang="tr">🇹🇷 Türkçe</button><button data-lang="en">🇬🇧 English</button><button data-lang="ar">🇸🇦 العربية</button></div></header><main><input class="search" id="search" type="search"><nav class="filters" id="filters"></nav><p class="notice" id="notice"></p><section class="grid" id="grid"></section></main><footer>Semazen Restaurant Cafe · İslambey, Eyüp Sultan Blv No:114, Eyüpsultan / İstanbul<br><a href="https://maps.app.goo.gl/d8vnrN6Rj3yJMcoT7" target="_blank" rel="noopener" id="route"></a></footer><script>
const translations={tr:{intro:"Geleneksel lezzetlerimizi keşfedin",search:"Menüde ara...",notice:"99 ürün · Görseller temsilidir, gerçek ürün fotoğraflarıyla güncellenecektir.",route:"Yol tarifi",cats:["Tümü","Kahvaltı & Çorba","Döner","Kebap","Pide & Lahmacun","Ana Yemekler","Tatlılar","İçecekler"]},en:{intro:"Discover our traditional flavors",search:"Search the menu...",notice:"99 items · Photos are illustrative and will be replaced with actual dish photos.",route:"Directions",cats:["All","Breakfast & Soup","Doner","Kebab","Pide & Lahmacun","Main Dishes","Desserts","Drinks"]},ar:{intro:"اكتشفوا نكهاتنا التقليدية",search:"ابحث في القائمة...",notice:"٩٩ صنفاً · الصور توضيحية وسيتم استبدالها بصور الأطباق الفعلية.",route:"الاتجاهات",cats:["الكل","الفطور والشوربة","الدونر","الكباب","الفطائر","الأطباق الرئيسية","الحلويات","المشروبات"]}};
const categoryPhotos={
1:"https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=640&q=75",
2:"https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=640&q=75",
3:"https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=640&q=75",
4:"https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=640&q=75",
5:"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=640&q=75",

7:"https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=640&q=75"
};let products=[];
let lang=localStorage.getItem("semazenLang")||"tr",cat=0;const $=id=>document.getElementById(id);function render(){const t=translations[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";document.body.dir=document.documentElement.dir;$("intro").textContent=t.intro;$("search").placeholder=t.search;$("notice").textContent=t.notice;$("route").textContent=t.route;document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));$("filters").replaceChildren(...t.cats.map((name,i)=>{const b=document.createElement("button");b.textContent=name;b.className=cat===i?"active":"";b.onclick=()=>{cat=i;render()};return b}));const q=$("search").value.toLocaleLowerCase();$("grid").replaceChildren(...products.filter(p=>(cat===0||p[0]===cat)&&p.slice(3).some(n=>n.toLocaleLowerCase().includes(q))).map(p=>{const a=document.createElement("article");a.className="card";const visual=document.createElement("div");visual.className="visual";const e=document.createElement("div");e.className="emoji";e.textContent=p[2];const h=document.createElement("h3");h.textContent=p[3+["tr","en","ar"].indexOf(lang)];const v=document.createElement("div");v.className="price";v.textContent=new Intl.NumberFormat("tr-TR").format(p[1])+" ₺";visual.append(e);const img=document.createElement("img");img.loading="lazy";img.decoding="async";img.alt=h.textContent;img.referrerPolicy="no-referrer";img.onload=()=>img.classList.add("loaded");img.onerror=()=>img.remove();img.src=p[6]||categoryPhotos[p[0]];visual.prepend(img);const details=document.createElement("div");details.className="details";details.append(h,v);a.append(visual,details);return a}))}document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem("semazenLang",lang);render()});$("search").oninput=render;async function loadMenu(){let data;try{const r=await fetch("/api/semazen/menu",{cache:"no-store"});if(!r.ok)throw Error("API unavailable");data=await r.json();if(!Array.isArray(data)||data.length===0)throw Error("Empty menu")}catch{const r=await fetch("./data/menu.json");if(!r.ok)throw Error("Static menu unavailable");data=await r.json()}products=data.map(p=>[p.cat,p.price,["🍳","🥙","🍢","🫓","🍽️","🍮","☕"][p.cat-1],...p.names,p.image||null]);render()}loadMenu().catch(()=>{$("notice").textContent="Menü yüklenemedi / Menu could not load"});render();
